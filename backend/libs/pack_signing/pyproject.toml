[project]
name = "qzdap-pack-signing"
version = "0.1.0"
description = "Generic Ed25519 pack signing primitives + trust-store scanner (used by Skill / Knowledge / Plan pack vetters)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap_pack_signing"]

[tool.ruff]
src = ["src"]