[project]
name = "qzdap-vector"
version = "0.1.0"
description = "Vector store abstractions (pgvector + milvus)"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap_vector"]

[tool.ruff]
src = ["src"]