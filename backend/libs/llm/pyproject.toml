[project]
name = "qzdap-llm"
version = "0.1.0"
description = "OpenAI-compatible LLM client + router + embeddings"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "httpx>=0.27.0",
    "pydantic>=2.9",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap_llm"]

[tool.ruff]
src = ["src"]