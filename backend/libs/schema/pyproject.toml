[project]
name = "qzdap-schema"
version = "0.1.0"
description = "Cross-module DTOs shared between libs and modules (branded IDs live in qzdap-kernel)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap_schema"]

