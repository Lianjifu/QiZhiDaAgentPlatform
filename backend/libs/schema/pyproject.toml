[project]
name = "qzdap-schema"
version = "0.1.0"
description = "Cross-module IDs and DTOs shared between libs and modules"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap_schema"]

[tool.ruff]
src = ["src"]