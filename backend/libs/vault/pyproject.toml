[project]
name = "qzdap-vault"
version = "0.1.0"
description = "Secrets resolution — env/file/noop backends + optional HashiCorp Vault / Vault CSI"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "qzdap-kernel",
    "pydantic>=2.9",
]

[project.optional-dependencies]
hashicorp = ["hvac>=2.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap_vault"]

[tool.ruff]
src = ["src"]
