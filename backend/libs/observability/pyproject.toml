[project]
name = "qzdap-observability"
version = "0.1.0"
description = "structlog + OpenTelemetry tracing + Prometheus metrics"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap_observability"]

[tool.ruff]
src = ["src"]