[alembic]
script_location = .
prepend_sys_path = libs/kernel/src:libs/schema/src:libs/persistence/src:libs/auth/src:libs/observability/src:libs/messaging/src:libs/llm/src:libs/sandbox/src:libs/vector/src:libs/http/src:modules/identity/src:composition/qzdap_app/src
path_separator = os
# Database URL is injected from env at runtime: alembic -x database_url=...

# We don't commit a hardcoded URL; `env.py` reads QZDAP_DATABASE_URL from env.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/qzdap_dev

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S