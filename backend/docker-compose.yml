name: qzdap-postgres-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qzdap-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qzdap_dev
    ports:
      - "9153:9153"
    volumes:
      - qzdap_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qzdap-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--port", "9154"]
    ports:
      - "9154:9154"
    volumes:
      - qzdap_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "9154", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qzdap_postgres:
  qzdap_redis: