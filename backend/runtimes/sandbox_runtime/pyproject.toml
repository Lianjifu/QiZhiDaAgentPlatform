[project]
name = "qzdap-sandbox-runtime"
version = "0.1.0"
description = "gVisor sandbox runtime sidecar — isolated skill and exec jobs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]
