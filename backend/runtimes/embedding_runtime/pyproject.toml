[project]
name = "qzdap-embedding-runtime"
version = "0.1.0"
description = "Embedding HTTP sidecar — wraps OpenAI / SBERT / NoOp behind one POST /embed"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-vault",
    "fastapi>=0.115.0",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]