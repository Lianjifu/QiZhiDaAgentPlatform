[project]
name = "qizhida-agent-platform"
version = "0.1.0"
description = "企智搭 · 智能体平台 — modular monolith on FastAPI + uv workspace"
requires-python = ">=3.12"
dependencies = [
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "import-linter>=2.3.0",
    "grimp>=3.2.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "testcontainers[postgres,redis,kafka]>=4.8.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/*",
    "modules/*",
    "runtimes/*",
    "composition/*",
]

[tool.uv.sources]
qzdap-kernel = { workspace = true }
qzdap-schema = { workspace = true }
qzdap-persistence = { workspace = true }
qzdap-observability = { workspace = true }
qzdap-auth = { workspace = true }
qzdap-messaging = { workspace = true }
qzdap-llm = { workspace = true }
qzdap-vector = { workspace = true }
qzdap-vault = { workspace = true }
qzdap-pack-signing = { workspace = true }
qzdap-http = { workspace = true }
qzdap-embedding-runtime = { workspace = true }
qzdap-sandbox-runtime = { workspace = true }
qzdap-identity = { workspace = true }
qzdap-agent-runtime = { workspace = true }
qzdap-tool = { workspace = true }
qzdap-skill = { workspace = true }
qzdap-memory = { workspace = true }
qzdap-governance = { workspace = true }
qzdap-model = { workspace = true }
qzdap-channel = { workspace = true }
qzdap-knowledge = { workspace = true }
qzdap-orchestration = { workspace = true }
qzdap-agent-factory = { workspace = true }
qzdap-evaluation = { workspace = true }
qzdap-observability-module = { workspace = true }
qzdap-platform = { workspace = true }
qzdap-self-evolution = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["libs", "modules", "composition"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle/pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "TCH",           # type-checking blocks
    "RUF",           # ruff-specific
    "ASYNC",         # async-correctness
    "S",             # bandit (security) — relaxed via per-file-ignores
    "TRY",           # tryceratops
]
ignore = [
    "S101",          # allow assert in tests
    "S104",          # allow 0.0.0.0 binding (gateway)
    "TRY003",        # allow raise-without-message in domain errors
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S", "B011"]
"**/migrations/**/*.py" = ["E", "F", "I", "N", "TC003"]
"**/router.py" = ["B008"]  # FastAPI Depends() in defaults is intentional
"**/events.py" = ["RUF009"]
"**/_in_memory.py" = ["PYI034"]
"**/uow.py" = ["PYI034"]
"lifespan.py" = ["PYI034"]

[tool.ruff.lint.isort]
known-first-party = ["qzdap_*", "qzdap"]

[tool.mypy]
python_version = "3.12"
# Each module under modules/ and composition/ is a separate namespace package;
# without `explicit_package_bases` mypy sees two packages with the same
# `__init__.py` leaf as a duplicate-module collision.
explicit_package_bases = true
# Week 1 settings: lenient on missing-imports / untyped-defs so we can land
# the broad skeleton. The plan is to tighten these in Week 2 once individual
# libs get `py.typed` markers.
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
# Each mypy_path entry MUST be the deepest directory that contains an
# __init__.py; otherwise mypy sees the same file as two modules
# (e.g. `identity.domain` AND `qzdap.modules.identity.domain`).
mypy_path = "libs/kernel/src:libs/auth/src:libs/observability/src:libs/persistence/src:libs/messaging/src:libs/http/src:libs/schema/src:libs/llm/src:libs/sandbox/src:libs/vector/src:libs/vault/src:libs/pack_signing/src:modules/identity/src/qzdap:modules/agent_runtime/src/qzdap:modules/tool/src/qzdap:modules/governance/src/qzdap:modules/channel/src/qzdap:modules/knowledge/src/qzdap:modules/orchestration/src/qzdap:modules/agent_factory/src/qzdap:modules/evaluation/src/qzdap:modules/platform/src/qzdap:modules/self_evolution/src/qzdap:composition/qzdap_app/src/qzdap"

[[tool.mypy.overrides]]
# Tests + generated migrations are exempt from strict checks.
module = [
    "tests.*",
    "modules.*.tests.*",
    "migrations.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Composition root and identity module currently lack full type annotations;
# tighten this list as `py.typed` markers land. We turn off `strict` rather
# than `ignore_errors` so per-file issues still surface, just at low priority.
module = [
    "qzdap.composition",
    "qzdap.modules.identity",
    "qzdap.modules.agent_runtime",
    "qzdap.modules.tool",
    "qzdap.modules.knowledge",
    "qzdap.modules.orchestration",
    "qzdap.modules.agent_factory",
    "qzdap.modules.evaluation",
]
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
# The OTLP gRPC exporter is an optional runtime dependency; ignore its
# stub-absence so the rest of `qzdap_observability` still type-checks.
module = ["qzdap_observability.tracing"]
ignore_errors = true

[[tool.mypy.overrides]]
# Allow missing type arguments and ambiguous suppression on libraries whose
# source predates the strict rollout.
module = [
    "qzdap_auth.*",
    "qzdap_http.*",
    "qzdap_messaging.*",
    "qzdap_observability.*",
    "qzdap_persistence.*",
    "qzdap_llm.*",
]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "modules", "runtimes"]
pythonpath = [
    "libs/kernel/src",
    "libs/auth/src",
    "libs/observability/src",
    "libs/persistence/src",
    "libs/messaging/src",
    "libs/http/src",
    "libs/schema/src",
    "libs/llm/src",
    "libs/vector/src",
    "libs/vault/src",
    "libs/pack_signing/src",
    "tests",
    "modules/identity/src/qzdap",
    "modules/agent_runtime/src/qzdap",
    "modules/tool/src/qzdap",
    "modules/skill/src/qzdap",
    "modules/memory/src/qzdap",
    "modules/governance/src/qzdap",
    "modules/model/src/qzdap",
    "modules/model/tests/unit",
    "modules/channel/src/qzdap",
    "modules/channel/tests/unit",
    "modules/knowledge/src/qzdap",
    "modules/orchestration/src/qzdap",
    "modules/orchestration/tests/unit",
    "modules/agent_factory/src/qzdap",
    "modules/agent_factory/tests/unit",
    "modules/evaluation/src/qzdap",
    "modules/evaluation/tests/unit",
    "modules/platform/src/qzdap",
    "modules/platform/tests/unit",
    "modules/self_evolution/src/qzdap",
    "runtimes/embedding_runtime/src/qzdap",
    "runtimes/sandbox_runtime/src/qzdap",
    "composition/qzdap_app/src/qzdap",
]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib --cov=qzdap_kernel --cov=qzdap_auth --cov=qzdap_observability --cov=qzdap_persistence --cov=qzdap_messaging --cov=qzdap_http --cov=qzdap_schema --cov=qzdap_llm --cov=qzdap_vector --cov=qzdap_vault --cov=qzdap --cov-report=term-missing"
markers = [
    "integration: marks integration tests (require DB/Redis)",
    "contract: marks contract tests",
    "smoke: marks end-to-end smoke tests",
]
