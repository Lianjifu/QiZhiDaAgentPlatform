[project]
name = "qzdap-app"
version = "0.1.0"
description = "Composition root for 企智搭 · 智能体平台"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-observability",
    "qzdap-auth",
    "qzdap-messaging",
    "qzdap-llm",
    "qzdap-vector",
    "qzdap-http",
    "qzdap-vault",
    "qzdap-identity",
    "qzdap-agent-runtime",
    "qzdap-tool",
    "qzdap-skill",
    "qzdap-orchestration",
    "qzdap-model",
    "qzdap-memory",
    "qzdap-governance",
    "qzdap-platform",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]