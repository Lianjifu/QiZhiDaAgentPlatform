[project]
name = "qzdap-observability-module"
version = "0.1.0"
description = "Observability module — RunRecord / CostRecord / QualityScore via event-bus subscribers; P9 of doc 12."
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-messaging",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]