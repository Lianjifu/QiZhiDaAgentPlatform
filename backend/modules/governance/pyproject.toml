[project]
name = "qzdap-governance"
version = "0.1.0"
description = "Governance module: policies, approvals, decision events, audit log"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-auth",
    "qzdap-messaging",
    "qzdap-http",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]
