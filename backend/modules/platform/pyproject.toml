[project]
name = "qzdap-platform"
version = "0.1.0"
description = "Platform module — Plan catalog + Subscription + TenantSetting get; P9 of doc 12."
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-http",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.hatch.build.targets.wheel.force-include]
"src/qzdap/modules/platform/fixtures/ops_seed.json" = "qzdap/modules/platform/fixtures/ops_seed.json"

[tool.ruff]
src = ["src"]