[project]
name = "qzdap-evaluation"
version = "0.1.0"
description = "Evaluation module — datasets, cases, runs and the gate the agent_factory Release endpoint calls into."
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-messaging",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]