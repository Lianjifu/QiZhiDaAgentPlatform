[project]
name = "qzdap-memory"
version = "0.1.0"
description = "Memory catalog: admin L1/L2/L3 layers and vector recall"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-vector",
    "qzdap-auth",
    "qzdap-http",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]
