[project]
name = "qzdap-model"
version = "0.1.0"
description = "Model catalog: admin providers/models/routes plus invoke for agent runtime"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-auth",
    "qzdap-messaging",
    "qzdap-llm",
    "qzdap-vault",
    "qzdap-http",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]