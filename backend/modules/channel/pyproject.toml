[project]
name = "qzdap-channel"
version = "0.1.0"
description = "Inbound/outbound channel adapters (Feishu, DingTalk, WeChat Work, Web) + webhook verification"
requires-python = ">=3.12"
dependencies = [
  "qzdap-kernel",
  "qzdap-schema",
  "qzdap-persistence",
  "qzdap-auth",
  "qzdap-observability",
  "qzdap-messaging",
  "qzdap-vault",
  "qzdap-http",
  # Gateway 层契约（qzdap_agent_runtime.gateway）—— 验签与服务账号物化.
  "qzdap-agent-runtime-runtime",
  "fastapi>=0.110",
  "pydantic>=2.5",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.pytest.ini_options]
pythonpath = [
  "src/qzdap",
  "tests/unit",
]
testpaths = ["tests/unit"]