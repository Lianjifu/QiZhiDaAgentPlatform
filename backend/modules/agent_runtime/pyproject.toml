[project]
name = "qzdap-agent-runtime"
version = "0.1.0"
description = "Agent runtime module: sessions, turns, LLM streaming, SSE"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-auth",
    "qzdap-messaging",
    "qzdap-llm",
    "qzdap-observability",
    # ActorContext 的来源（qzdap_vault.actor）—— 本模块有 5 个文件 import 它，
    # 不声明的话 isolated install 环境直接 ModuleNotFoundError.
    "qzdap-vault",
    # 本模块的适配器**直接 import** 这些模块（adapter/tools ✓ / adapter/skills ✓
    # / adapter/memory ✓ / adapter/knowledge ✓ / adapter/routing ✓）——
    # 直接 import 的依赖就该写出来 ✓（否则 isolated install 一样炸 ✗）。
    # ⚠️ **方向不反** ✓：这些模块都不依赖 qzdap-agent-runtime ✓（无环 ✓）。
    "qzdap-tool",
    "qzdap-skill",
    "qzdap-memory",
    "qzdap-model",
    "qzdap-knowledge",
    "qzdap-governance",
    # Gateway 层契约（qzdap_agent_runtime.gateway）—— 幂等键与判定结果类型.
    "qzdap-agent-runtime-runtime",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
    "httpx>=0.28.0",
    "langgraph>=1.0,<2.0",
    "langgraph-prebuilt>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]