[project]
name = "qzdap-agent-runtime"
version = "0.1.0"
description = "Agent runtime module: sessions, turns, LLM streaming, SSE"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-auth",
    "qzdap-messaging",
    "qzdap-llm",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
    "httpx>=0.28.0",
    "langgraph>=0.2.28",
    "langchain-core>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]