[project]
name = "qzdap-agent-runtime"
version = "0.1.0"
description = "Agent runtime module: sessions, turns, LLM streaming, SSE"
requires-python = ">=3.12"
dependencies = [
    "qzdap-kernel",
    "qzdap-schema",
    "qzdap-persistence",
    "qzdap-auth",
    "qzdap-messaging",
    "qzdap-llm",
    "qzdap-observability",
    # ActorContext 的来源（qzdap_vault.actor）—— 本模块有 5 个文件 import 它，
    # 不声明的话 isolated install 环境直接 ModuleNotFoundError.
    "qzdap-vault",
    # Gateway 层契约（qzdap_agent_runtime.gateway）—— 幂等键与判定结果类型.
    "qzdap-agent-runtime-runtime",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
    "httpx>=0.28.0",
    "langgraph>=1.0,<2.0",
    "langgraph-prebuilt>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qzdap"]

[tool.ruff]
src = ["src"]