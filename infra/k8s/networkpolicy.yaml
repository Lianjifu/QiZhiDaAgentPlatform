apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qzdap-app
  namespace: qzdap-prod
spec:
  podSelector:
    matchLabels:
      app: qzdap
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress-nginx controller to reach pods
    - from:
        - namespaceSelector: { matchLabels: { name: ingress-nginx } }
        - podSelector: {}  # same-namespace
      ports:
        - port: 8102
          protocol: TCP
        - port: 9102
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres
    - to:
        - namespaceSelector: { matchLabels: { name: kube-system } }
        - podSelector: {}
      ports:
        - port: 5432
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
    # S3-compatible object storage
    - ports:
        - port: 443
          protocol: TCP
    # OTLP
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
