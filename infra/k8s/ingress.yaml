# Header-based canary routing.
# Primary rule (no annotation) → stable. Canary rule (annotations)
# activates when the request carries `X-QZDAP-Ring: canary`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qzdap-app
  namespace: qzdap-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_input_headers "X-Forwarded-Proto: https";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
spec:
  ingressClassName: nginx
  tls:
    - hosts: [qzdap.example.com]
      secretName: qzdap-app-tls
  rules:
    - host: qzdap.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qzdap-app-stable
                port:
                  number: 80
---
# Canary ingress — only matches when X-QZDAP-Ring: canary is set.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qzdap-app-canary
  namespace: qzdap-prod
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-QZDAP-Ring"
    nginx.ingress.kubernetes.io/canary-by-header-value: "canary"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [qzdap.example.com]
      secretName: qzdap-app-tls
  rules:
    - host: qzdap.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qzdap-app-canary
                port:
                  number: 80
