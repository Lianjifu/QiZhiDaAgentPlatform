# Secret template — NEVER commit real values.
# Production values come from one of two pipelines (pick per-secret):
#
#   (a) External Secrets Operator (ESO)
#       - Each ``SecretProviderClass`` mirrors a Vault KV v2 path.
#       - The pod reads the rendered k8s Secret via envFrom.
#       - Ref style: ``vault:secret/data/<path>`` (HashiCorp Vault KV v2).
#
#   (b) HashiCorp Vault CSI Provider
#       - SecretProviderClass mounts at ``/vault/secrets/<KEY>`` (RO).
#       - The pod's resolver reads ``csi:<KEY>`` to consume the file.
#       - Use this when secrets must NEVER appear as env vars
#         (e.g. compliance / FIPS).
#
# gitleaks (configured in `.gitleaks.toml`) catches accidental commits
# of real secret values.
apiVersion: v1
kind: Secret
metadata:
  name: qzdap-app-secret
  namespace: qzdap-prod
  annotations:
    # (a) ESO binding — see infra/k8s/external-secret.example.yaml
    # unseal.io/cluster: vault
    # vault.unsealer.io/vault-addr: https://vault.internal:8200
    description: |
      Template only.  In production, real values are injected by
      External Secrets Operator from vault://prod/qzdap/* paths
      (HashiCorp Vault KV v2), or mounted as files via the Vault CSI
      provider (see SecretProviderClass example).
      See deploy/env.prod.example for the matching env list.
type: Opaque
stringData:
  QZDAP_DATABASE_URL: "postgresql+asyncpg://qzdap:PLACEHOLDER_PG_PASS@postgres:5432/qzdap"
  QZDAP_REDIS_URL: "redis://redis:6379/0"
  QZDAP_JWT_SECRET: "PLACEHOLDER_JWT_SECRET"
  QZDAP_RUN_TOKEN_SECRET: "PLACEHOLDER_RUN_TOKEN_SECRET"
  QZDAP_MODEL_MASTER_KEY: "PLACEHOLDER_MODEL_MASTER_KEY_HEX"
  QZDAP_OBJECT_STORAGE_URL: "https://s3.internal.example.com"
  QZDAP_OTLP_ENDPOINT: "https://otel.internal.example.com:4317"
  QZDAP_SENTRY_DSN: "https://PLACEHOLDER@sentry.internal/1"
  QZDAP_AUDIT_KAFKA_BOOTSTRAP_SERVERS: "kafka.prod.svc.cluster.local:9092"
---
# (b) Vault CSI provider — mount per-secret files under /vault/secrets/.
#     The Python resolver reads these as ``csi:<KEY_NAME>`` refs.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: qzdap-app-csi
  namespace: qzdap-prod
spec:
  provider: vault
  parameters:
    # HashiCorp Vault CSI driver contract — see
    # https://developer.hashicorp.com/vault/docs/platform/k8s/csi
    vaultAddress: "https://vault.internal:8200"
    roleName: "qzdap-app"
    objects: |
      - objectName: "QZDAP_JWT_SECRET"
        secretPath: "secret/data/prod/qzdap/jwt_secret"
        secretKey: "value"
      - objectName: "QZDAP_MODEL_MASTER_KEY"
        secretPath: "secret/data/prod/qzdap/model_master_key"
        secretKey: "value"
      - objectName: "QZDAP_RUN_TOKEN_SECRET"
        secretPath: "secret/data/prod/qzdap/run_token_secret"
        secretKey: "value"
      - objectName: "QZDAP_OPENAI_API_KEY"
        secretPath: "secret/data/prod/qzdap/openai_key"
        secretKey: "value"
  secretObjects:
    - secretName: qzdap-app-csi-synced
      type: Opaque
      data:
        - objectName: "QZDAP_JWT_SECRET"
          key: QZDAP_JWT_SECRET
        - objectName: "QZDAP_MODEL_MASTER_KEY"
          key: QZDAP_MODEL_MASTER_KEY
        - objectName: "QZDAP_RUN_TOKEN_SECRET"
          key: QZDAP_RUN_TOKEN_SECRET
        - objectName: "QZDAP_OPENAI_API_KEY"
          key: QZDAP_OPENAI_API_KEY
