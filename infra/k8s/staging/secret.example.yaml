# Secret template for staging — NEVER commit real values.
# All nine ``QZDAP_*_REF`` env vars in deploy/env.prod.example resolve through
# the HashiCorp Vault CSI driver, which mounts each entry under
# ``/vault/secrets/<KEY>``.  The Python resolver reads those files as
# ``csi:<KEY>`` refs (see composition/qzdap_app/.../ref_resolver.py).
#
# Workflow (staging):
#   cp infra/k8s/staging/secret.example.yaml infra/k8s/staging/secret.yaml
#   $EDITOR secret.yaml        # fill vaultAddress, roleName, objects[].secretPath
#   kubectl apply -f infra/k8s/staging/secret.yaml -n qzdap-staging
#
# secret.yaml is in .gitignore (gitleaks G5 also catches accidental commits).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: qzdap-app-csi
  namespace: qzdap-staging
spec:
  provider: vault
  parameters:
    # HashiCorp Vault CSI driver contract —
    # https://developer.hashicorp.com/vault/docs/platform/k8s/csi
    vaultAddress: "https://PLACEHOLDER_VAULT_HOST:8200"
    roleName: "PLACEHOLDER_VAULT_ROLE"
    objects: |
      - objectName: "QZDAP_DATABASE_URL"
        secretPath: "secret/data/staging/qzdap/database_url"
        secretKey: "value"
      - objectName: "QZDAP_REDIS_URL"
        secretPath: "secret/data/staging/qzdap/redis_url"
        secretKey: "value"
      - objectName: "QZDAP_JWT_SECRET"
        secretPath: "secret/data/staging/qzdap/jwt_secret"
        secretKey: "value"
      - objectName: "QZDAP_MODEL_MASTER_KEY"
        secretPath: "secret/data/staging/qzdap/model_master_key"
        secretKey: "value"
      - objectName: "QZDAP_RUN_TOKEN_SECRET"
        secretPath: "secret/data/staging/qzdap/run_token_secret"
        secretKey: "value"
      - objectName: "QZDAP_OPENAI_API_KEY"
        secretPath: "secret/data/staging/qzdap/openai_key"
        secretKey: "value"
      - objectName: "QZDAP_OBJECT_STORAGE_URL"
        secretPath: "secret/data/staging/qzdap/s3_url"
        secretKey: "value"
      - objectName: "QZDAP_OTLP_ENDPOINT"
        secretPath: "secret/data/staging/qzdap/otlp_endpoint"
        secretKey: "value"
      - objectName: "QZDAP_SENTRY_DSN"
        secretPath: "secret/data/staging/qzdap/sentry_dsn"
        secretKey: "value"
  # CSI driver injects the mounted files as k8s Secret data so the pod's
  # envFrom can pull them in by key.  Sync interval below matches the
  # staging cluster's SecretProviderClass refresh window (5 min).
  secretObjects:
    - secretName: qzdap-app-csi-synced
      type: Opaque
      data:
        - objectName: "QZDAP_DATABASE_URL"
          key: QZDAP_DATABASE_URL
        - objectName: "QZDAP_REDIS_URL"
          key: QZDAP_REDIS_URL
        - objectName: "QZDAP_JWT_SECRET"
          key: QZDAP_JWT_SECRET
        - objectName: "QZDAP_MODEL_MASTER_KEY"
          key: QZDAP_MODEL_MASTER_KEY
        - objectName: "QZDAP_RUN_TOKEN_SECRET"
          key: QZDAP_RUN_TOKEN_SECRET
        - objectName: "QZDAP_OPENAI_API_KEY"
          key: QZDAP_OPENAI_API_KEY
        - objectName: "QZDAP_OBJECT_STORAGE_URL"
          key: QZDAP_OBJECT_STORAGE_URL
        - objectName: "QZDAP_OTLP_ENDPOINT"
          key: QZDAP_OTLP_ENDPOINT
        - objectName: "QZDAP_SENTRY_DSN"
          key: QZDAP_SENTRY_DSN