apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qzdap-app-stable
  namespace: qzdap-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qzdap-app-stable
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qzdap-app-canary
  namespace: qzdap-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qzdap-app-canary
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
