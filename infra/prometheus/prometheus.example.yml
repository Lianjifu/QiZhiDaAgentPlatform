# Example Prometheus configuration for 企智搭 · 智能体平台.
#
# Drop this into /etc/prometheus/prometheus.yml (or mount via
# docker-compose) so Prometheus scrapes the app and loads QZDAP
# rules.  This file is documentation; production deploys MUST
# review and customize before use.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: qzdap-dev

# Alertmanager wiring (out of scope for P9-6; placeholder).
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  # ── QZDAP backend HTTP /metrics endpoint ────────────────────────────────
  # The ``/metrics`` endpoint is exposed by the FastAPI app once
  # the prometheus_client instrumentation middleware is registered
  # (planned for P10+; P9-6 only provisions the rules + dashboards
  # so the panels become live once middleware lands).
  - job_name: qzdap-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - qzdap-app:8102
        labels:
          service: qzdap-backend
          env: development

  # ── Prometheus self ──────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
