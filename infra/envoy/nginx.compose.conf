# Docker Compose local nginx config — header-based split.
# Used by deploy/docker-compose.prod.yml `ingress` service with
# profile "with-ingress". Routes X-QZDAP-Ring: canary → canary pool,
# otherwise → stable pool.

events { worker_connections 1024; }

http {
  upstream stable { server qzdap-app-stable:8102; }
  upstream canary { server qzdap-app-canary:8102; }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_read_timeout 60s;

      set $backend stable;
      if ($http_x_qzdap_ring = "canary") { set $backend canary; }
      proxy_pass http://$backend;
    }
  }
}
