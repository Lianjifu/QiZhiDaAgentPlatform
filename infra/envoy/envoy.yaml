# Envoy standalone header-route.
# Optional alternative to the nginx-ingress canary annotation in
# infra/k8s/ingress.yaml. Use when running Envoy as the only ingress
# (no ingress-nginx) or when layering it behind a layer-4 LB.
#
# Match X-QZDAP-Ring: canary  → qzdap_canary cluster (port 8103)
# Otherwise                  → qzdap_stable cluster (port 8102)

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: qzdap_ingress
                codec_type: AUTO
                route_config:
                  virtual_hosts:
                    - name: qzdap
                      domains: ["*"]
                      routes:
                        - match:
                            headers:
                              - name: x-qzdap-ring
                                exact_match: canary
                          route:
                            cluster: qzdap_canary
                            timeout: 60s
                        - match:
                            prefix: /
                          route:
                            cluster: qzdap_stable
                            timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: qzdap_stable
      type: STRICT_DNS
      load_assignment:
        cluster_name: qzdap_stable
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: qzdap-app-stable
                      port_value: 8102
    - name: qzdap_canary
      type: STRICT_DNS
      load_assignment:
        cluster_name: qzdap_canary
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: qzdap-app-canary
                      port_value: 8102
